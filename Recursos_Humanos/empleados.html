<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Empleados - RH</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="./js/empleados.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">RH - Taller de Node.js S.A. de C.V.</span>
            <button class="btn btn-outline-light btn-sm" id="btn-logout">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container">
        <!-- Formulario Agregar / Editar -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="form-title">Agregar Nuevo Empleado</h5>
            </div>
            <div class="card-body">
                <input type="hidden" id="empleado-id">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombre">Nombre(s)</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej. Ana">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" class="form-control" id="apellidos" placeholder="Ej. Pantoja Núñez">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="telefono">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" placeholder="Ej. 4421234567">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="ana@empresa.com">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="direccion">Dirección</label>
                        <input type="text" class="form-control" id="direccion" placeholder="Calle Zaragoza #23">
                    </div>
                </div>
                <button class="btn btn-success" id="btn-save">Guardar Empleado</button>
                <button class="btn btn-secondary d-none" id="btn-cancel">Cancelar Edición</button>
            </div>
        </div>

        <!-- Buscador por nombre -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="input-search" placeholder="Buscar empleado por nombre...">
                    <div class="input-group-append">
                        <button class="btn btn-info" id="btn-search">Buscar</button>
                        <button class="btn btn-outline-secondary" id="btn-reset">Ver Todos</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de Empleados -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="thead-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellidos</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Dirección</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-empleados">
                            <!-- Se llena dinámicamente con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
